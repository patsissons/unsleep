# Builds UnSleep.app for Apple silicon. On pull requests the zip is kept as a
# workflow artifact; on a published release it's attached to the release as
# UnSleep-<version>.zip, which the patsissons/tap Homebrew cask downloads.
#
# The app is ad-hoc signed, not Developer ID signed or notarized, so
# Gatekeeper asks users to approve it on first launch.
name: Release

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15  # arm64
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.plist version $version"
            exit 1
          fi

      - name: Build
        run: |
          xcrun swiftc --version
          APPDIR="$PWD/dist" BINDIR= ./build.sh

      - name: Sign (ad hoc)
        run: |
          app=dist/UnSleep.app
          codesign --force --sign - "$app/Contents/Helpers/unsleep"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke test
        run: |
          file dist/UnSleep.app/Contents/MacOS/UnSleep dist/UnSleep.app/Contents/Helpers/unsleep
          dist/UnSleep.app/Contents/Helpers/unsleep status | grep -q "app not running"

      - name: Zip
        run: |
          zip="UnSleep-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent dist/UnSleep.app "$zip"
          shasum -a 256 "$zip" | tee "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: UnSleep-${{ steps.version.outputs.version }}
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --clobber
